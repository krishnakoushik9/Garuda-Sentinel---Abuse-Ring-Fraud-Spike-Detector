<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 // FRAUD INTELLIGENCE PLATFORM</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Thin Operational Status Strip (Height: 28px) -->
        <div class="ops-status-strip">
            <div class="logo">
                <span class="pulse"></span>
                <h1>FRAUD INTELLIGENCE <span>BOI FDS v4.0</span></h1>
            </div>
            
            <div class="system-status-group">
                <div class="status-badge">
                    <span class="pulse"></span>
                    <span>SYSTEM STATUS: <strong>LIVE</strong></span>
                </div>
                <div class="status-badge">
                    <span>Kafka Stream: <strong style="color: var(--emerald)">ACTIVE</strong></span>
                </div>
                <div class="status-badge">
                    <span>COBOL Engine: <strong style="color: var(--emerald)">ACTIVE</strong></span>
                </div>
                <div class="status-badge" style="border-left: 1px solid rgba(255,255,255,0.1); padding-left: 0.75rem; margin-left: 0.25rem;">
                    <span id="live-clock" style="font-weight: 700; color: #FFF;">--:--:--</span>
                </div>
            </div>
        </div>

        <!-- Scrollable Dashboard Content Viewport -->
        <main id="view-container">
            <!-- Dynamically populated by app.js -->
        </main>

        <!-- Premium macOS-Inspired Floating Dock with Spring Physics -->
        <div class="dock-container">
            <div class="dock-panel" id="mac-dock" role="toolbar" aria-label="Application dock">
                <a href="#/" class="dock-item" data-hash="#/" data-label="Overview">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" /><rect x="14" y="3" width="7" height="5" /><rect x="14" y="12" width="7" height="9" /><rect x="3" y="16" width="7" height="5" /></svg>
                    </span>
                    <span class="dock-tooltip">Overview</span>
                </a>
                
                <a href="#/transactions" class="dock-item" data-hash="#/transactions" data-label="Transactions">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    </span>
                    <span class="dock-tooltip">Transactions</span>
                </a>
                
                <a href="#/accounts" class="dock-item" data-hash="#/accounts" data-label="Accounts">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </span>
                    <span class="dock-tooltip">Accounts</span>
                </a>
                
                <a href="#/graph" class="dock-item" data-hash="#/graph" data-label="Graph">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="5" cy="5" r="3"/><circle cx="19" cy="19" r="3"/><path d="M17 7L7 17M7 7l10 10"/></svg>
                    </span>
                    <span class="dock-tooltip">Community Graph</span>
                </a>
                
                <a href="#/investigate" class="dock-item" data-hash="#/investigate" data-label="Investigate">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="11" r="3"/><path d="M12 14v4"/></svg>
                    </span>
                    <span class="dock-tooltip">Investigate</span>
                </a>
                
                <a href="#/alerts" class="dock-item" data-hash="#/alerts" data-label="Alerts">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    </span>
                    <span class="dock-tooltip">Alert Console</span>
                </a>
                
                <a href="#/money-flow" class="dock-item" data-hash="#/money-flow" data-label="Money Flow">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    </span>
                    <span class="dock-tooltip">Money Flow</span>
                </a>
                
                <a href="#/ews" class="dock-item" data-hash="#/ews" data-label="EWS">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </span>
                    <span class="dock-tooltip">Early Warning</span>
                </a>
                
                <a href="#/regulatory" class="dock-item" data-hash="#/regulatory" data-label="Regulatory">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    </span>
                    <span class="dock-tooltip">Regulatory</span>
                </a>
                
                <a href="#/cross-channel" class="dock-item" data-hash="#/cross-channel" data-label="Channels">
                    <span class="dock-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                    </span>
                    <span class="dock-tooltip">Channels</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Modal Overlays -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>

version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/fraud_detection_2026
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.,apoc."
      NEO4J_dbms_security_procedures_allowlist: "gds.,apoc."
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins

  redis:
    image: redis/redis-stack:7.2.0-v11
    ports:
      - "6379:6379"
      - "8001:8001"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fraud_detection_2026
      POSTGRES_DB: fraud_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fraud-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SQLITE_DB_PATH: ./data/banking.db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fraud_detection_2026
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP: kafka:9092
      API_PORT: 8000
      API_HOST: 0.0.0.0
      MODEL_DIR: ./models
      COGNEE_API_KEY: cognee_api_key_test_123
      COGNEE_BASE_URL: https://tenant-3d30d425-a5a1-488d-ad2c-a1444ffc2914.aws.cognee.ai
      COGNEE_TENANT_ID: 3d30d425-a5a1-488d-ad2c-a1444ffc2914
      COGNEE_USER_ID: dd98b1ea-5f7e-4b56-b255-e96b98632d51
    depends_on:
      - kafka
      - neo4j
      - redis
      - postgres

volumes:
  neo4j_data:
  neo4j_plugins:
  postgres_data:
